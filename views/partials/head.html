<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{TITULO}}</title>
<meta name="description" content="{{META_DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
<!-- Open Graph (partilha em FB/IG/WhatsApp) -->
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:site_name" content="{{NOME}}">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{META_DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:locale" content="pt_PT">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{META_DESC}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">
{{JSONLD}}
<!-- Fontes: display pesado para títulos/preços + sans para corpo + mono pontual -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family={{FONTE_TITULO}}:wght@700;800;900&family={{FONTE_CORPO}}:wght@400;500;600;700;800&family={{FONTE_MONO}}:wght@400;500&display=swap" rel="stylesheet">
<!-- Variáveis CSS geradas a partir do config.js -->
<style>{{CSS_VARS}}</style>
<link rel="stylesheet" href="/css/style.css">
<!-- Config público da loja para o frontend -->
<script nonce="{{NONCE}}">window.LOJA = {{CONFIG_JSON}};</script>
{{PIXELS}}
