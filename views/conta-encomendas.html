<!DOCTYPE html>
<html lang="pt">
<head>{{include:head}}</head>
<body>
{{include:header}}
<main class="conta-area">
  <div class="conta-area-inner">

    <!-- Topo: saudação + sair -->
    <div class="conta-area-topo">
      <div class="conta-avatar-wrap">
        <div class="conta-avatar" id="conta-avatar">?</div>
        <div>
          <h1 id="conta-saudacao">A minha conta</h1>
          <p id="conta-email" class="conta-email-label"></p>
        </div>
      </div>
      <button class="btn btn-contorno btn-sm" id="btn-sair">Sair</button>
    </div>

    <!-- Menu de secções -->
    <nav class="conta-menu" id="conta-menu">
      <button class="conta-menu-item ativa" data-secao="encomendas">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        As minhas encomendas
        <svg class="conta-menu-seta" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="conta-menu-item" data-secao="dados">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 20c1.4-3 4-4.5 7-4.5s5.6 1.5 7 4.5"/></svg>
        Dados pessoais
        <svg class="conta-menu-seta" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </nav>

    <!-- Secção: Encomendas -->
    <section id="secao-encomendas" class="conta-secao">
      <div id="enc-loading" class="enc-estado">A carregar…</div>
      <div id="enc-vazio" class="enc-vazio-wrap" hidden>
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <p>Ainda não fizeste nenhuma encomenda.</p>
        <a href="/produtos" class="btn btn-primario">Explorar produtos</a>
      </div>
      <div id="enc-lista" class="enc-lista" hidden></div>
    </section>

    <!-- Secção: Dados Pessoais -->
    <section id="secao-dados" class="conta-secao" hidden>
      <div class="conta-dados-card">
        <div class="conta-dados-linha">
          <span class="conta-dados-label">Nome</span>
          <span class="conta-dados-valor" id="dp-nome">—</span>
        </div>
        <div class="conta-dados-linha">
          <span class="conta-dados-label">Email</span>
          <span class="conta-dados-valor" id="dp-email">—</span>
        </div>
        <div class="conta-dados-linha">
          <span class="conta-dados-label">Membro desde</span>
          <span class="conta-dados-valor" id="dp-desde">—</span>
        </div>
      </div>
    </section>

  </div>
</main>
{{include:footer}}
<script nonce="{{NONCE}}">
(function() {
  const fmt = v => (v / 100).toFixed(2).replace('.', ',') + ' €';
  const fmtData = s => new Date(s).toLocaleDateString('pt-PT', { day:'2-digit', month:'long', year:'numeric' });

  const ESTADOS_PAG = { pendente:'Pendente', paga:'Paga', reembolsada:'Reembolsada', cancelada:'Cancelada' };
  const ESTADOS_FUL = { por_encomendar:'A processar', encomendada_fornecedor:'Encomendada', enviada:'Enviada', entregue:'Entregue' };
  const COR_PAG = { paga:'verde', pendente:'laranja', reembolsada:'cinza', cancelada:'vermelho' };
  const COR_FUL = { por_encomendar:'cinza', encomendada_fornecedor:'azul', enviada:'roxo', entregue:'verde' };

  // Navegação entre secções
  const itens = document.querySelectorAll('.conta-menu-item');
  itens.forEach(btn => {
    btn.addEventListener('click', () => {
      itens.forEach(b => b.classList.remove('ativa'));
      btn.classList.add('ativa');
      document.querySelectorAll('.conta-secao').forEach(s => s.hidden = true);
      document.getElementById('secao-' + btn.dataset.secao).hidden = false;
    });
  });

  // Dados do utilizador
  fetch('/api/conta/eu').then(r => r.ok ? r.json() : null).then(c => {
    if (!c) return location.href = '/conta';
    const primeiroNome = c.nome.split(' ')[0];
    document.getElementById('conta-saudacao').textContent = 'Olá, ' + primeiroNome;
    document.getElementById('conta-email').textContent = c.email;
    document.getElementById('conta-avatar').textContent = primeiroNome[0].toUpperCase();
    document.getElementById('dp-nome').textContent = c.nome;
    document.getElementById('dp-email').textContent = c.email;
    document.getElementById('dp-desde').textContent = fmtData(c.criado_em);
  });

  // Encomendas
  fetch('/api/conta/encomendas').then(r => r.ok ? r.json() : []).then(lista => {
    document.getElementById('enc-loading').hidden = true;
    if (!lista.length) { document.getElementById('enc-vazio').hidden = false; return; }
    const el = document.getElementById('enc-lista');
    el.hidden = false;
    el.innerHTML = lista.map(e => {
      const items = JSON.parse(e.items || '[]');
      const resumo = items.map(i => `${i.nome} ×${i.qtd}`).join(', ');
      return `<a class="enc-cartao" href="/conta/encomenda/${e.numero_encomenda}">
        <div class="enc-cartao-topo">
          <span class="enc-numero">${e.numero_encomenda}</span>
          <span class="enc-data">${fmtData(e.created_at)}</span>
        </div>
        <p class="enc-resumo">${resumo}</p>
        <div class="enc-cartao-rodape">
          <span class="enc-total">${fmt(e.total)}</span>
          <div class="enc-pills">
            <span class="enc-pill enc-pill--${COR_PAG[e.estado_pagamento]}">${ESTADOS_PAG[e.estado_pagamento]}</span>
            <span class="enc-pill enc-pill--${COR_FUL[e.estado_fulfillment]}">${ESTADOS_FUL[e.estado_fulfillment]}</span>
          </div>
        </div>
        ${e.tracking_number ? `<p class="enc-tracking">Rastreio: <strong>${e.tracking_number}</strong></p>` : ''}
      </a>`;
    }).join('');
  });

  document.getElementById('btn-sair').addEventListener('click', () => {
    fetch('/api/conta/sair', { method: 'POST' }).then(() => location.href = '/');
  });
})();
</script>
</body>
</html>
