<!DOCTYPE html>
<html lang="pt">
<head>
{{include:admin-head}}
</head>
<body data-adm-page="dashboard">
{{include:admin-nav}}
<main class="adm-main">
  <h1>Dashboard</h1>

  <div class="adm-live" id="adm-live">
    <div class="adm-live-card">
      <span class="adm-live-dot"></span>
      <div>
        <small>No site agora</small>
        <strong id="live-total">—</strong>
      </div>
    </div>
    <div class="adm-live-card">
      <span class="adm-live-dot adm-live-dot--checkout"></span>
      <div>
        <small>No checkout</small>
        <strong id="live-checkout">—</strong>
      </div>
    </div>
    <div class="adm-live-card">
      <span class="adm-live-dot adm-live-dot--carrinho"></span>
      <div>
        <small>Com carrinho</small>
        <strong id="live-carrinho">—</strong>
      </div>
    </div>
  </div>

  <div class="adm-cards" id="adm-cards">
    <div class="adm-card"><small>Hoje</small><strong id="c-hoje">—</strong></div>
    <div class="adm-card"><small>Últimos 7 dias</small><strong id="c-7">—</strong></div>
    <div class="adm-card"><small>Últimos 30 dias</small><strong id="c-30">—</strong></div>
    <div class="adm-card"><small>Receita 30 dias</small><strong id="c-receita">—</strong></div>
    <div class="adm-card"><small>Lucro est. 30 dias</small><strong id="c-lucro">—</strong></div>
    <a class="adm-card" id="c-card-encomendar" href="/admin/encomendas?estado_fulfillment=por_encomendar&estado_pagamento=paga">
      <small>Por encomendar ao fornecedor</small><strong id="c-encomendar">—</strong>
    </a>
  </div>

  <h2>Últimas encomendas</h2>
  <div class="adm-tabela-wrap">
    <table class="adm-tabela">
      <thead><tr><th>Nº</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Fulfillment</th><th>Data</th></tr></thead>
      <tbody id="t-ultimas"><tr><td colspan="6" class="adm-vazio">A carregar…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="/js/admin.js"></script>
</body>
</html>
