<!DOCTYPE html>
<html lang="pt">
<head>
{{include:admin-head}}
</head>
<body data-adm-page="encomendas">
{{include:admin-nav}}
<main class="adm-main">
  <div class="adm-cabeca">
    <h1>Encomendas</h1>
    <a class="adm-btn adm-btn-fantasma" id="btn-csv" href="#">Exportar CSV</a>
  </div>

  <div class="adm-filtros">
    <input type="search" id="f-pesquisa" placeholder="Pesquisar nome, email ou nº…">
    <select id="f-pagamento">
      <option value="">Pagamento: todos</option>
      <option value="pendente">Pendente</option>
      <option value="paga">Paga</option>
      <option value="reembolsada">Reembolsada</option>
      <option value="cancelada">Cancelada</option>
    </select>
    <select id="f-fulfillment">
      <option value="">Fulfillment: todos</option>
      <option value="por_encomendar">Por encomendar</option>
      <option value="encomendada_fornecedor">Encomendada ao fornecedor</option>
      <option value="enviada">Enviada</option>
      <option value="entregue">Entregue</option>
    </select>
    <input type="date" id="f-data-ini" title="De">
    <input type="date" id="f-data-fim" title="Até">
    <label class="adm-check-label"><input type="checkbox" id="f-esconder-testes" checked> Esconder testes</label>
  </div>

  <div class="adm-bulk" id="adm-bulk" hidden>
    <span id="bulk-contagem">0 selecionadas</span>
    <select id="bulk-acao">
      <option value="">Ação…</option>
      <option value="apagar">Apagar</option>
      <option value="teste">Marcar como teste</option>
      <option value="nao_teste">Remover marcação de teste</option>
    </select>
    <button class="adm-btn adm-btn-secundario" id="btn-bulk-aplicar">Aplicar</button>
    <button class="adm-btn adm-btn-fantasma" id="btn-bulk-cancelar">Cancelar</button>
  </div>

  <div class="adm-tabela-wrap">
    <table class="adm-tabela">
      <thead><tr><th><input type="checkbox" id="bulk-todos"></th><th>Nº</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Fulfillment</th><th>Data</th><th></th></tr></thead>
      <tbody id="t-encomendas"><tr><td colspan="8" class="adm-vazio">A carregar…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="/js/admin.js"></script>
</body>
</html>
